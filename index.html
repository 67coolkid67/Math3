<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading</title>
</head>
<body>
    <main id="status" aria-live="polite">Loading site...</main>
    <script>
        (async () => {
            try {
                if ("serviceWorker" in navigator) {
                    navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(error => {
                        console.error("Service worker registration failed:", error);
                    });
                }

                const url = "https://cdn.jsdelivr.net/gh/virtuan4-max/ghostlinkhub@latest/ghostlinksinglefile.html?v=" + Date.now();
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Remote page returned ${response.status}`);

                const html = await response.text();
                document.open();
                document.write(html);
                document.close();
            } catch (error) {
                console.error("Unable to load the remote page:", error);
                document.querySelector("#status").textContent = "The site could not be loaded. Please try again later.";
            }
        })();
    </script>
</body>
</html>
