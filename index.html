<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10131c">
    <title>Continue to Math3</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #10131c;
            color: #f4f5f7;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        main {
            width: min(100%, 420px);
            padding: 32px;
            box-sizing: border-box;
            border: 1px solid #303646;
            border-radius: 16px;
            background: #191e2a;
            box-shadow: 0 18px 55px #0005;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #9ba8ff;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.7rem, 6vw, 2.2rem);
        }

        p {
            color: #c2c7d2;
            line-height: 1.6;
        }

        .verification {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
            padding: 16px;
            border: 1px solid #41495d;
            border-radius: 10px;
            background: #121620;
            cursor: pointer;
            font-weight: 600;
        }

        .verification input {
            width: 22px;
            height: 22px;
            margin: 0;
            accent-color: #7886ff;
            cursor: pointer;
        }

        .verification input:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        .note {
            margin-bottom: 0;
            font-size: 0.85rem;
        }

    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Math3 transition</p>
        <h1>Ready to continue?</h1>
        <p>IDK securly check</p>
        <label class="verification">
            <input id="continue" type="checkbox">
            <span>I'm not securly</span>
        </label>
        <p class="note">Check the box to continue to Math3.</p>
    </main>
    <script>
        document.getElementById("continue").addEventListener("change", (event) => {
            if (event.target.checked) {
                sessionStorage.setItem("math3-transition-accepted", "true");
                window.location.href = "./self%20hosting/";
            }
        });
    </script>
</body>
</html>
